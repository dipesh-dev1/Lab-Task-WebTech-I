<!DOCTYPE html>
<html>
<head>
<title>Responsive Design Example</title>
<style>
body{
font-family: Arial;
text-align:center;
}

.box{
width:400px;
margin:auto;
padding:20px;
background-color:lightblue;
}

/* Media Query for small screens */
@media screen and (max-width:600px){

.box{
width:200px;
background-color:lightgreen;
}
}
</style>
</head>
<body>
<h2>Responsive Webpage Example</h2>

<div class="box">
This box changes size and color on small screens.
</div>
</body>
</html>
