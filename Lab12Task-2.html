<!DOCTYPE html>
<html>
<head>
<title>CSS Layout Example</title>

<style>

.box{
    background-color: lightblue;
    padding:10px;
    margin:5px;
}

/* Inline */
.inline span{
    display:inline;
    background-color:lightgreen;
    padding:5px;
}

/* Inline-block */
.inlineblock div{
    display:inline-block;
    width:100px;
    height:50px;
    background-color:lightcoral;
    margin:5px;
}

/* Float (color changed here) */
.float div{
    width:100px;
    height:50px;
    background-color:lightgreen;
    float:left;
    margin:5px;
}

/* Flexbox */
.flex{
    display:flex;
    gap:10px;
}
.flex div{
    background-color:lightpink;
    padding:20px;
}

/* Grid */
.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}
.grid div{
    background-color:lightgray;
    padding:20px;
}

</style>
</head>

<body>

<h2>Inline Example</h2>
<div class="inline">
<span>Item 1</span>
<span>Item 2</span>
<span>Item 3</span>
</div>

<h2>Inline-block Example</h2>
<div class="inlineblock">
<div></div>
<div></div>
<div></div>
</div>

<h2>Float Example</h2>
<div class="float">
<div></div>
<div></div>
<div></div>
</div>

<div style="clear:both;"></div>

<h2>Flexbox Example</h2>
<div class="flex">
<div>Box 1</div>
<div>Box 2</div>
<div>Box 3</div>
</div>

<h2>Grid Example</h2>
<div class="grid">
<div>1</div>
<div>2</div>
<div>3</div>
<div>4</div>
<div>5</div>
<div>6</div>
</div>

</body>
</html>
