<!DOCTYPE html>
<html>
<head>
<title>JavaScript Data Types</title>
</head>
<body>
<h2>JavaScript Data Types Example</h2>
<p id="demo"></p>
<script>
// Number
let num = 10;

// String
let name = "Dipesh";

// Boolean
let isStudent = true;

// Object
let person = {name:"Dipesh", age:21};

// Undefined
let x;

// Null
let y = null;
document.getElementById("demo").innerHTML =
"Number: " + num + "<br>" +
"String: " + name + "<br>" +
"Boolean: " + isStudent + "<br>" +
"Object: " + person.name + "<br>" +
"Undefined: " + x + "<br>" +
"Null: " + y;
</script>
</body>
</html>
