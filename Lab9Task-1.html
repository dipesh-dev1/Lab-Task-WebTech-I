<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Font Awesome Icons Example</title>
    <!-- Link Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-..."
     crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
        }
        .icon {
            font-size: 50px;       /* Icon size */
            color: #3498db;        /* Icon color */
            margin: 20px;
            transition: color 0.3s; /* Smooth hover effect */
        }
        .icon:hover {
            color: #e74c3c;        /* Color on hover */
        }
    </style>
</head>
<body>

<h2>Font Awesome Icons Example</h2>

<i class="fas fa-home icon"></i>
<i class="fas fa-star icon"></i>
<i class="fas fa-heart icon"></i>
<i class="fas fa-envelope icon"></i>

</body>
</html>
