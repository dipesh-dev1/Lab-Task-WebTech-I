<!DOCTYPE html>
<html>
<head>
<title>Button Hover Effect</title>
<style>
button{
background-color:blue;
color:white;
padding:10px 20px;
border:none;
font-size:16px;

/* transition effect */
transition: background-color 0.5s;
}

/* hover effect */
button:hover{
background-color:red;
}
</style>
</head>
<body>

<h2>CSS Transition Button</h2>

<button>Click Me</button>
</body>
</html>
