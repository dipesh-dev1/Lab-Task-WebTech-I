<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Organized Lists</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
    }
    h2 {
      color: #333;
      margin-top: 30px;
    }
    ol, ul {
      margin-left: 20px;
    }
    .shopping-list {
      list-style-type: decimal;
    }
    .todo-list {
      list-style-type: upper-alpha;
    }
    .travel-plans {
      list-style-type: lower-roman;
    }
  </style>
</head>
<body>
  <h2> Shopping List</h2>
  <ol class="shopping-list">
    <li>Apples</li>
    <li>Bananas</li>
    <li>Oranges</li>
  </ol>

  <h2> To-Do List</h2>
  <ol class="todo-list">
    <li>Complete project report</li>
    <li>Attend team meeting</li>
    <li>Reply to emails</li>
  </ol>

  <h2> Travel Plans</h2>
  <ol class="travel-plans">
    <li>Book flight tickets</li>
    <li>Reserve hotel room</li>
    <li>Pack luggage</li>
    <li>Get travel insurance</li>
  </ol>
</body>
</html>
