<!DOCTYPE html>
<html>
<head>
<title>JavaScript Literals Example</title>
</head>
<body>
<h2>JavaScript Literals Demo</h2>

<p id="demo"></p>
<script>

// String literal
let name = "Dipesh";

// Numeric literal
let number = 100;

// Boolean literal
let isStudent = true;

// Object literal
let person = {
    name: "Dipesh",
    age: 21
};

document.getElementById("demo").innerHTML =
"String Literal: " + name + "<br>" +
"Numeric Literal: " + number + "<br>" +
"Boolean Literal: " + isStudent + "<br>" +
"Object Literal (Name): " + person.name;

</script>
</body>
</html>
