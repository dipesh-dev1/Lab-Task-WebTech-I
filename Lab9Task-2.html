<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Font Awesome Icons Example</title>
    <!-- Link Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-..."
     crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
        }
        .icon {
            font-size: 50px;       /* Icon size */
            color: #3498db;        /* Icon color */
            margin: 20px;
            transition: transform 0.3s, color 0.3s; /* Smooth hover effect */
        }
        .icon:hover {
            color: #e74c3c;        /* Color on hover */
            transform: scale(1.2); /* Slight enlargement on hover */
        }
    </style>
</head>
<body>

<h2>Different Font Awesome Icons</h2>
<!-- Social media icon -->
<i class="fab fa-facebook icon"></i>
<!-- User icon -->
<i class="fas fa-user icon"></i>
<!-- Shopping cart icon -->
<i class="fas fa-shopping-cart icon"></i>
</body>
</html>
