<!DOCTYPE html>
<html>
<head>
<title>JavaScript Function Example</title>
</head>
<body>

<h2>JavaScript Function Example</h2>

<p id="demo"></p>

<script>

// Function definition
function showMessage(){
    document.getElementById("demo").innerHTML = "Hello! This is a JavaScript function.";
}

// Function call
showMessage();

</script>

</body>
</html>
