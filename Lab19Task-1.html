<!DOCTYPE html>
<html>
<head>
<title>JavaScript Operators Example</title>
</head>
<body>
<h2>JavaScript Operators Demo</h2>
<p id="demo"></p>
<script>

// Arithmetic Operators
let a = 10;
let b = 5;
let sum = a + b;

// Assignment Operator
let x = 20;
x += 10;

// Comparison Operator
let compare = (a > b);

// Logical Operator
let logical = (a > 5 && b < 10);

document.getElementById("demo").innerHTML =
"Sum (Arithmetic): " + sum + "<br>" +
"Assignment Result: " + x + "<br>" +
"Comparison (a > b): " + compare + "<br>" +
"Logical (a>5 && b<10): " + logical;

</script>
</body>
</html>
