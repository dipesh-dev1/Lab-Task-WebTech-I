<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Units Demo</title>
    <style>
        /* Absolute units */
        .absolute-px {
            width: 200px;
            height: 100px;
            background-color: lightblue;
            margin-bottom: 20px;
        }
        .absolute-cm {
            width: 5cm;
            height: 2cm;
            background-color: lightgreen;
            margin-bottom: 20px;
        }

        /* Relative units */
        .relative-em {
            width: 20em;
            height: 5em;
            background-color: lightcoral;
            margin-bottom: 20px;
        }
        .relative-percent {
            width: 50%;
            height: 50px;
            background-color: lightpink;
            margin-bottom: 20px;
        }
        .relative-vhvw {
            width: 50vw;
            height: 20vh;
            background-color: lightyellow;
        }
    </style>
</head>
<body>

<h2>CSS Units Demo</h2>

<p>Absolute units:</p>
<div class="absolute-px">200px x 100px</div>
<div class="absolute-cm">5cm x 2cm</div>

<p>Relative units:</p>
<div class="relative-em">20em x 5em</div>
<div class="relative-percent">50% width</div>
<div class="relative-vhvw">50vw x 20vh</div>

</body>
</html>
