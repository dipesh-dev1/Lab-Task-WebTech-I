<!DOCTYPE html>
<html>
<head>
<title>Function Parameters Example</title>
</head>
<body>

<h2>JavaScript Function with Parameters</h2>

<p id="demo"></p>

<script>

// Function with parameters
function addNumbers(a, b){
    return a + b;
}

// Function call
let result = addNumbers(5, 3);

document.getElementById("demo").innerHTML = "Sum is: " + result;

</script>

</body>
</html>
