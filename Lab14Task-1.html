<!DOCTYPE html>
<html>
<head>
<title>CSS Position Example</title>
<style>
.box{
width:200px;
padding:15px;
margin:10px;
color:white;
}

/* Static */
.static{
background-color:gray;
position:static;
}

/* Relative */
.relative{
background-color:blue;
position:relative;
left:20px;
}

/* Absolute */
.absolute{
background-color:green;
position:absolute;
top:150px;
left:250px;
}

/* Fixed */
.fixed{
background-color:red;
position:fixed;
top:10px;
right:10px;
}

/* Sticky */
.sticky{
background-color:purple;
position:sticky;
top:0;
}
</style>
</head>
<body>
<h2>CSS Position Properties</h2>
<div class="box static">Static Position</div>
<div class="box relative">Relative Position</div>
<div class="box absolute">Absolute Position</div>
<div class="box fixed">Fixed Position</div>
<div class="box sticky">Sticky Position</div>
<p style="margin-top:500px;">Scroll down to see 
    the fixed and sticky positions working.</p>
</body>
</html>
