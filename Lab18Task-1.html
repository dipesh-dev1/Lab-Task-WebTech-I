<!DOCTYPE html>
<html>
<head>
<title>JavaScript Variables Example</title>
</head>
<body>

<h2>JavaScript Variables Demo</h2>

<p id="demo"></p>

<script>
// Using var
var name = "Dipesh";
document.getElementById("demo").innerHTML += "Name (var): " + name + "<br>";

// Using let
let age = 21;
document.getElementById("demo").innerHTML += "Age (let): " + age + "<br>";

// Using const
const university = "LTU";
document.getElementById("demo").innerHTML += "College (const): " + university;
</script>

</body>
</html>
