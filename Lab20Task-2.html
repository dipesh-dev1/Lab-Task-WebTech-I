<!DOCTYPE html>
<html>
<head>
<title>Prime Number Check</title>
</head>
<body>

<h2>Prime Number Check</h2>

<p id="result"></p>

<script>

let num = 7;
let isPrime = true;

if(num <= 1){
isPrime = false;
}

for(let i = 2; i < num; i++){
if(num % i == 0){
isPrime = false;
break;
}
}

if(isPrime){
document.getElementById("result").innerHTML = num + " is a Prime Number";
}else{
document.getElementById("result").innerHTML = num + " is Not a Prime Number";
}

</script>
</body>
</html>
