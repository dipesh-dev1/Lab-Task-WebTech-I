<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Multimedia Example</title>
</head>
<body>
    <h1>HTML5 Multimedia Elements</h1>

    <h2>Audio Example</h2>
    <audio controls>
        <source src="Audio/spy.mp4" type="audio/mp4">
        Your browser does not support the audio element.
    </audio>

    <h2>Video Example</h2>
    <video width="320" height="240" controls>
        <source src="Video/water.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>

    <h2>Embed Example</h2>
    <embed src="Files/Profile.pdf" width="400" height="300" type="application/pdf">

    <h2>Object Example</h2>
    <object data="Files/CompTIA A+ 220-1201 Exam Objectives (4.0).pdf" width="400" height="300" type="application/pdf">
        Your browser does not support the object element.
    </object>
</body>
</html>
